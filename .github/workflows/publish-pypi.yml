name: Publish EthosoftLib to PyPI

on:
  # A published GitHub release uploads to PyPI.
  release:
    types: [published]
  # Manual retry of an ALREADY published release: explicit opt-in.
  # Default remains build-only. Run manual publishing on main.
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish an existing GitHub release to PyPI? (default: build only)"
        type: boolean
        default: false
        required: true
      release_tag:
        description: "Existing published release tag, e.g. v0.4.0"
        type: string
        default: "v0.4.0"
        required: true
  # Run the packaging checks before merging workflow changes.
  pull_request:
    paths:
      - '.github/workflows/publish-pypi.yml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'src/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  build:
    name: Build and validate Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Manual publish builds from the immutable release TAG, not the
          # current default branch. This preserves original release content.
          ref: ${{ (github.event_name == 'release' && github.event.release.tag_name) || (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag) || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify manual publishing targets an existing public release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || { echo "Manual publishing is restricted to main"; exit 1; }
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '(.draft == false) and (.prerelease == false)')" = "true" || {
            echo "Release tag does not refer to a published, non-prerelease GitHub Release"; exit 1;
          }
      - name: Check release tag matches pyproject version
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          RELEASE_TAG: ${{ (github.event_name == 'release' && github.event.release.tag_name) || inputs.release_tag }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          metadata = tomllib.loads(Path("pyproject.toml").read_text("utf-8"))
          version = metadata["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} != package version v{version}")
          print(f"Publishing exact version: {version}")
          PY
      - name: Install packaging and tests
        run: python -m pip install --upgrade build twine pytest
      - name: Install this source checkout for tests
        run: python -m pip install --no-deps -e .
      - name: Test dependency-free SDK core
        run: |
          python -m compileall -q src
          python -m pytest -q tests/test_registry.py tests/test_plugin_sdk.py tests/test_mercan_chat.py tests/test_nedo_tokenizer.py
      - name: Build sdist and universal Python wheel
        run: python -m build
      - name: Verify metadata, wheel platform tag, and no bundled native payload
        shell: bash
        run: |
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1 and len(sdists) == 1, (wheels, sdists)
          assert wheels[0].name.endswith("-py3-none-any.whl"), wheels[0]
          with zipfile.ZipFile(wheels[0]) as wheel:
              members = wheel.namelist()
              assert not any(n.endswith((".so", ".dylib", ".dll")) for n in members), members
              assert any(n.endswith("/math/__init__.py") for n in members), "Math module missing"
              assert any(n.endswith("/nedo/__init__.py") for n in members), "Nedo Python adapter missing"
              assert any(n.endswith("/mercan/model.py") for n in members), "Mercan Python adapter missing"
          print("Source distribution and pure Python wheel validated")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-ethosoftlib-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish verified package to PyPI (OIDC)
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ethosoftlib
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-ethosoftlib-distributions
          path: dist/
      - name: Upload using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
