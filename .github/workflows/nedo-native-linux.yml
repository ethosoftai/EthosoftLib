name: NedoTokenizer native Linux parity

on:
  workflow_dispatch:
  push:
    branches: [main, feature/nedo-tokenizer-python]
    paths:
      - 'src/ethosoftlib/nedo/**'
      - 'src/ethosoftlib/mercan/__init__.py'
      - 'scripts/build_nedo_native_linux.sh'
      - 'tests/test_nedo_integration.py'
      - 'tests/test_nedo_tokenizer.py'
      - '.github/workflows/nedo-native-linux.yml'
  pull_request:
    paths:
      - 'src/ethosoftlib/nedo/**'
      - 'scripts/build_nedo_native_linux.sh'
      - 'tests/test_nedo*'
      - '.github/workflows/nedo-native-linux.yml'

permissions:
  contents: read

jobs:
  rust-nedo:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build original Rust tokenizer cdylib
        run: |
          bash scripts/build_nedo_native_linux.sh
          test -s src/ethosoftlib/nedo/lib/libnedo004_ffi.so
      - name: Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test exact Rust NDSRF004 from Python
        env:
          ETHOSOFT_NEDO_LIBRARY: ${{ github.workspace }}/src/ethosoftlib/nedo/lib/libnedo004_ffi.so
        run: python -m pytest -q tests/test_nedo_integration.py tests/test_nedo_tokenizer.py
      - name: Wheel contains native tokenizer
        run: |
          python -m build --wheel
          python - <<'PY'
          import glob, zipfile
          wheels = glob.glob('dist/*.whl')
          assert len(wheels) == 1 and 'none-any' not in wheels[0], wheels
          with zipfile.ZipFile(wheels[0]) as whl:
              assert any(n.endswith('/nedo/lib/libnedo004_ffi.so') for n in whl.namelist())
          print('Nedo native wheel packaged:', wheels[0])
          PY
      - name: Verify installed wheel from clean virtualenv
        run: |
          python -m venv /tmp/ethosoft-nedo-venv
          /tmp/ethosoft-nedo-venv/bin/pip install --no-deps dist/*.whl
          cd /tmp
          env -u ETHOSOFT_NEDO_LIBRARY /tmp/ethosoft-nedo-venv/bin/python - <<'PY'
          from ethosoftlib.nedo import Tokenizer
          t = Tokenizer()
          example = "İstanbul'da Türkçe 😀"
          assert t.decode(t.encode(example)) == example
          print('Wheel NDSRF004 tokenization verified with SHA:', t.vocab_sha256)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ethosoftlib-nedo-linux-native-wheel
          path: dist/*.whl
          if-no-files-found: error
