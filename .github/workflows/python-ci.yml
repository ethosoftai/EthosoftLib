name: EthosoftLib Python CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Validate package and tests
        run: |
          python -m compileall -q src
          python -m pytest -q
          python -m build
