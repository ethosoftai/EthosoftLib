[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ethosoftlib"
version = "0.3.0"
description = "Extensible Python SDK for independent Ethosoft products and integrations"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Ethosoft"}]
keywords = ["ethosoft", "sdk", "integrations", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
hub = ["huggingface_hub>=0.30"]
dev = ["pytest>=7", "build>=1.0", "huggingface_hub>=0.30"]

[project.urls]
Repository = "https://github.com/ethosoftai/EthosoftLib"
Issues = "https://github.com/ethosoftai/EthosoftLib/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ethosoftlib*"]

[tool.setuptools.package-data]
"ethosoftlib.mercan" = ["lib/*.so", "lib/*.dylib", "lib/*.dll"]
"ethosoftlib.nedo" = ["lib/*.so", "lib/*.dylib", "lib/*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
